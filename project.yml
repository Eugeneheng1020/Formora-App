name: Formora
options:
  bundleIdPrefix: com.eugenecheng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Release is the App Store build (sandboxed); ReleaseDeveloperID the 官网版 (no sandbox, computer use, stdio MCP) —
# what Debug is while developing, optimised. `package.sh` archives ReleaseDeveloperID into a dmg.
configs:
  Debug: debug
  Release: release
  ReleaseDeveloperID: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Signed to run locally (ad-hoc), so anyone can build it. To sign with your own team instead, set
    # DEVELOPMENT_TEAM and CODE_SIGN_STYLE: Automatic, and remove CODE_SIGN_IDENTITY.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Formora:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Resources/Preview
        type: folder
        buildPhase: resources
      - path: Resources/ProviderLogos
        type: folder
        buildPhase: resources
      - path: Resources/Knowledge
        type: folder
        buildPhase: resources
      - path: Resources/Skills
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eugenecheng.formora
        PRODUCT_NAME: Formora
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Formora.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Formora
        # The faceted cube: App/AppIcon.icon for macOS 26, App/Assets.xcassets/AppIcon.appiconset before it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Eugene Cheng"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "允许操作电脑的 Agent 会用脚本控制这个应用，替你完成你交给它的事。"
      # The Developer ID build: Debug is that build while developing, ReleaseDeveloperID when it ships — no App
      # Sandbox, computer use, stdio MCP.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/Formora-DeveloperID.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORMORA_DEVELOPER_ID"
        ReleaseDeveloperID:
          CODE_SIGN_ENTITLEMENTS: App/Formora-DeveloperID.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FORMORA_DEVELOPER_ID"
schemes:
  Formora:
    build:
      targets:
        Formora: all
    run:
      config: Debug
    archive:
      config: ReleaseDeveloperID
